<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<h1>My<span id="third">Book</span>List</h1>
	<div class="form-group">
		<form method="post">
			<label for="title" >Title</label>
			<input id="title" class="info" type="text" name="title" style="border-bottom:1px solid blue">
			<br>
			<label for="author">Author</label>
			<input id="author" class="info" type="text" name="author" style="border-bottom:1px solid blue">
			<br>
			<label for="ISBN">ISBN#</label>
			<input id="isbn" type="number" class="info" name="ISBN" style="border-bottom:1px solid blue">
			<br>
			<button  type="submit" id="submit" >Add Book</button>
			<br>
		</form>
	</div>
	
	<table class="table table-striped" style="width:90%">
		<thead >
			<th >Title</th>
			<th >Author</th>
			<th >ISBN#</th>
			<th ></th>
		</thead>
		<tbody id="book-list">
			
		</tbody>
	</table>
	<!-- the entire body must be written by student -->
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
